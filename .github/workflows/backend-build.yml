name: Backend Build & Test

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running this workflow'
        required: false
        default: 'Manual build'

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcpx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked || true

      - name: Run Clippy (Lint)
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Format Check
        working-directory: backend
        run: cargo fmt --check

      - name: Run Tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mcpx_test
        run: cargo test --all-features

      - name: Run Coverage
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mcpx_test
        run: cargo tarpaulin --out Xml --out Html --skip-clean || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/tarpaulin-report.html
          if-no-files-found: ignore
