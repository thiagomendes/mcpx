name: Backend Build & Test

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running this workflow'
        required: false
        default: 'Manual build'

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcpx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked || true

      - name: Run Clippy (Lint)
        id: clippy
        working-directory: backend
        run: |
          echo "## 🔍 Clippy Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy_output.txt; then
            echo "✅ **No lint warnings or errors found!**" >> $GITHUB_STEP_SUMMARY
            echo "clippy_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ **Clippy found issues:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat clippy_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "clippy_status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Run Format Check
        working-directory: backend
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📝 Format Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if cargo fmt --check 2>&1; then
            echo "✅ **Code is properly formatted**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some files need formatting**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run Tests
        id: tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mcpx_test
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if cargo test --all-features 2>&1 | tee test_output.txt; then
            echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
            echo "test_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ **Some tests failed:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 test_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "test_status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Run Coverage
        id: coverage
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mcpx_test
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cargo tarpaulin --out Xml --out Html --skip-clean 2>&1 | tee coverage_output.txt || true
          COVERAGE=$(grep -oP 'coverage: \K[0-9.]+' coverage_output.txt | tail -1 || echo "N/A")
          echo "**Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "coverage_percent=${COVERAGE}" >> $GITHUB_OUTPUT

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/tarpaulin-report.html
          if-no-files-found: ignore

      - name: Final Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Clippy | ${{ steps.clippy.outputs.clippy_status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ steps.tests.outputs.test_status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ steps.coverage.outputs.coverage_percent }}% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
