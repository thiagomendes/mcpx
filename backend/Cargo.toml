[package]
name = "mcpx-backend"
version = "1.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"

# Web server (API + MCP Proxy)
[[bin]]
name = "mcpx-web"
path = "src/bin/web.rs"

# Background worker (Jobs)
[[bin]]
name = "mcpx-worker"
path = "src/bin/worker.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "migrate"] }

# Authentication
oauth2 = "4.4"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# MCP SDK (Client-side for upstream connections) - using git for latest API
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", branch = "main", features = ["client", "auth", "transport-streamable-http-client-reqwest"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
dashmap = "6.1"

# Security
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
aes-gcm = "0.10"
sha2 = "0.10"
urlencoding = "2.1"
regex = "1.11"
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
axum-test = "17"
