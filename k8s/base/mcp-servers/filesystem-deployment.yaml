apiVersion: apps/v1
kind: Deployment
metadata:
  name: filesystem-mcp
  namespace: mcpx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filesystem-mcp
  template:
    metadata:
      labels:
        app: filesystem-mcp
    spec:
      containers:
      - name: filesystem
        image: mcpx-filesystem:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 3
          periodSeconds: 5
