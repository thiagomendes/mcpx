apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpx-web
  namespace: mcpx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcpx-web
  template:
    metadata:
      labels:
        app: mcpx-web
    spec:
      containers:
      - name: web
        image: mcpx-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["./mcpx-web"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: mcpx-config
              key: DATABASE_URL
        - name: RUST_LOG
          valueFrom:
            configMapKeyRef:
              name: mcpx-config
              key: RUST_LOG
        - name: BASE_URL
          valueFrom:
            configMapKeyRef:
              name: mcpx-config
              key: BASE_URL
              optional: true
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: mcpx-config
              key: FRONTEND_URL
              optional: true
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mcpx-secrets
              key: JWT_SECRET
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mcpx-secrets
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mcpx-secrets
              key: GOOGLE_CLIENT_SECRET
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mcpx-secrets
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mcpx-secrets
              key: GITHUB_CLIENT_SECRET
        - name: MICROSOFT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mcpx-secrets
              key: MICROSOFT_CLIENT_ID
        - name: MICROSOFT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mcpx-secrets
              key: MICROSOFT_CLIENT_SECRET
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
